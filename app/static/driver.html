<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Driver mode</title>
<style>
  /* DRIVER MODE.
     One number, one colour, audio for THERMAL alerts only.

     The rule this page is built to: a driver must never have to read or tap
     anything at speed. So there is no list, no history, no scrolling, and
     nothing that rewards a second look. The colour carries the message from
     peripheral vision; the number is there only to confirm it once stopped.

     Mismatch and novel alerts do not appear here AT ALL. A boost leak is a
     mechanic's problem and a confidence flag is ours. Neither is worth a
     glance at 110 km/h, and putting them on this screen would teach the
     driver to ignore it. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:#10151c;color:#fff;overflow:hidden;
       font:16px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;transition:background .45s}
  body.ok{background:#0f2a17}
  body.warn{background:#5a3208}
  body.crit{background:#6b1414}
  body.unknown{background:#191f27}

  main{flex:1;display:flex;flex-direction:column;align-items:center;
       justify-content:center;text-align:center;padding:16px}
  .label{font-size:clamp(13px,3.2vw,20px);letter-spacing:.22em;text-transform:uppercase;
         opacity:.62;font-weight:600}
  .num{font-size:clamp(96px,34vw,300px);font-weight:700;line-height:.92;
       font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:6px 0}
  .unit{font-size:clamp(20px,6vw,44px);opacity:.55;font-weight:600}
  .msg{font-size:clamp(17px,4.6vw,30px);font-weight:650;margin-top:10px;
       max-width:22ch;min-height:1.2em}
  .sub{font-size:clamp(11px,2.6vw,14px);opacity:.5;margin-top:14px;max-width:34ch}
  body.crit .num{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}

  footer{display:flex;align-items:center;gap:14px;padding:10px 16px;
         font-size:11.5px;opacity:.5;border-top:1px solid rgba(255,255,255,.12)}
  footer a{color:inherit}
  button{font:inherit;font-size:13px;padding:9px 16px;border-radius:9px;
         border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
         color:#fff;cursor:pointer}
  #sound{margin-left:auto}
</style>
</head>
<body class="unknown">

<main>
  <div class="label" id="label">turbine — estimated</div>
  <div class="num" id="num">—</div>
  <div class="unit" id="unit">°C</div>
  <div class="msg" id="msg"></div>
  <div class="sub" id="sub">Model estimate. Not a sensor reading.</div>
</main>

<footer>
  <span id="src">connecting…</span>
  <a href="/">full dashboard</a>
  <button id="sound">Enable sound</button>
</footer>

<script>
const $ = id => document.getElementById(id);
// Thresholds come from the server (meta.limits), which reads them from
// engine_env.TURB_PROTECT_K -- the same constant check_premise.py and
// generality_test.py score with. This page keeps no copy of its own.
let LIMIT = 850;

/* ---- audio -------------------------------------------------------------
   Browsers will not start an AudioContext without a gesture, so sound is
   armed once by a tap. Tap it while stationary; it stays armed for the
   session. Thermal alerts only -- nothing else makes a noise. */
let ac = null, armed = false;
$("sound").onclick = () => {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    armed = true;
    $("sound").textContent = "Sound on";
    beep(880, 0.12, 0.25);
  } catch(_) { $("sound").textContent = "Sound unavailable"; }
};
function beep(freq, dur, gain){
  if (!ac || !armed) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(gain, ac.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur + 0.02);
}
function chirp(kind){
  if (kind === "critical"){            // three rising, urgent
    beep(740, .16, .35); setTimeout(()=>beep(950,.16,.35), 190);
    setTimeout(()=>beep(1180,.30,.38), 380);
  } else {                             // two soft, advisory
    beep(620, .14, .22); setTimeout(()=>beep(760,.18,.22), 170);
  }
}

/* ---- painting --------------------------------------------------------- */
let clearMsg = null;
function setMsg(text, ttl){
  $("msg").textContent = text;
  if (clearMsg) clearTimeout(clearMsg);
  if (ttl) clearMsg = setTimeout(() => { $("msg").textContent = ""; }, ttl);
}

function paint(p){
  const s = p.state || {}, m = p.meta || {};
  if (m.limits?.turb_c) LIMIT = m.limits.turb_c;
  $("src").textContent = `${m.source ?? "—"} · ${m.mode ?? "—"}`;

  if (!s.ok){
    document.body.className = "unknown";
    $("num").textContent = "—"; $("unit").textContent = "";
    $("label").textContent = "waiting for the engine";
    $("sub").textContent = "No usable data yet.";
    return;
  }

  /* WARM-UP. The model is still forgetting its seed, so there is no number
     to show. A driver shown a number treats it as the truth -- so we show
     none, and say plainly that nothing is being watched yet. Thermal alerts
     are suppressed in this window anyway (alerts.py), so there is nothing
     for the driver to act on and nothing is being hidden from them. */
  if (s.warming_up){
    document.body.className = "unknown";
    $("label").textContent = "warming up";
    $("num").textContent = "—";
    $("unit").textContent = "";
    $("sub").textContent =
      `Estimate still settling (${Math.round(s.seed_band_k ?? 0)} K uncertain). `
      + `Not watching yet.`;
    return;
  }

  const t = s.t_turb_c;
  $("label").textContent = "turbine — estimated";
  $("num").textContent = (t === null || t === undefined) ? "—" : Math.round(t);
  $("unit").textContent = "°C";
  $("sub").textContent = "Model estimate. Not a sensor reading.";

  document.body.className = t >= LIMIT ? "crit" : t >= (LIMIT - 70) ? "warn" : "ok";

  for (const a of (p.alerts || [])){
    if (a.kind !== "thermal") continue;      // driver hears thermal only
    chirp(a.severity);
    setMsg(a.advice, 12000);
  }
}

function connect(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => { try { paint(JSON.parse(e.data)); } catch(_){} };
  ws.onclose = () => {
    document.body.className = "unknown";
    $("src").textContent = "reconnecting…";
    setTimeout(connect, 1200);
  };
}
connect();
</script>
</body>
</html>
