# engine_specs/accord_2018.toml -- the 2018 Honda Accord LX 1.5 L turbo with its
# CVT: the car the honda_l15b7 plant runs in (decision 24 puts EPA's L15B7 map, a
# 2016 Civic's, into this body), its TYPED constants and its locked climb.
#
# The format, the labels and the rule against typed DERIVED values are
# engine_specs/b58.toml's (engines.read_spec). Written on 22 October 2026 (build
# step 2 P6: docs/build_step_2/PLAN.md WP1 P6 and section 7.5, as its amendments
# docs/build_step_2/AMENDMENTS.md F6, F12 and C13 correct it; decisions 40, 42, 44
# and 45, results/VALIDATION_DECISIONS.md section H). The layout is engine_specs/
# cx9_2016.toml's, with a CVT in place of the stepped box.
#
# NOT TYPED HERE. The mass, the wheel radius (at the CVT's top ratio) and EPA's
# road load (A, B, C and the air they hold at) are CONVERTED from the published
# car file named below, with exact factors (engines.published_car; decision 42);
# the deliverable-torque table is DERIVED, measured through the frozen plant after
# its freeze (engines.EPA_DERIVED_FIELDS; PLAN.md 5.9 item 1). Values carried from
# the Supra's car are marked "CARRIED FROM THE B58: " as engine_specs/mazda_25t.toml
# describes, and test_carried.py checks them; test_cars.py prints the converted
# values and checks the typed ones against the published file.
#
# THE RATIO LAW is decision 40's (b), a stateless kickdown (engines.CvtCar,
# engine_env.CvtVehicle; amendment F6): the top ratio while the demand there is at
# most kickdown_load of the deliverable torque, otherwise the lowest engine speed
# whose demand is at most target_load of it. Disclosed (decision 40): 0.75 and 0.65
# are points of the D3 strand's in-sample grid, and no gated row uses them.

id = "accord_2018_15t"
# kind -- which car record and vehicle model this car is (engines.CAR_KINDS,
# engine_env.vehicle_for): "three_term_cvt", engines.CvtCar and engine_env.CvtVehicle,
# EPA's three-term road load and a CVT run by decision 40's law. label DESIGN;
# source: decisions 40 and 42 (results/VALIDATION_DECISIONS.md section H) and build
# step 2 P5 and P6 (docs/build_step_2/PLAN.md WP1, 7.1-7.3), 22 October 2026. A
# top-level key cannot be a { value, label, source } entry (engines.read_spec reads a
# table as a section), so its label and source are this comment (amendment B13); it
# is hashed by its value.
kind = "three_term_cvt"
# published -- the published car file the mass, the wheel radius and the road load
# are converted from (engines.published_car): EPA's Test Car List row of the car
# Argonne tested in D3, rows 1932-1933 of the 2018 list, the targets D3 drove on
# (its [epa_test_car]). label DESIGN; source: decision 42 and
# engine_specs/cars/README.md, "Deriving what the model needs" (a CVT's N/V depends
# on the ratio it was in: published_car reads it at the top ratio, 0.405); build
# step 2 P6, 22 October 2026; a comment, as kind's (amendment B13).
# fingerprint.plant_files hashes the file with the specs (engines.spec_files).
published = "engine_specs/cars/accord_2018_15t.toml"

[car]
final_drive = { value = 5.36, label = "PUBLISHED", source = "Honda's 2018 Accord specifications (HSPEC); D3ACC prints 'Differential Gear Ratio: 5.36' and EPA's axle ratio is 5.36 (engine_specs/cars/accord_2018_15t.toml [final_drive]; Honda's press kit's 3.238 is ruled out there)" }
ratio_low_gear = { value = 2.645, label = "PUBLISHED", source = "the CVT's lowest gear, '2.645 ~ 0.405' for every 1.5 L trim: HSPEC; D3ACC prints 'Ratio Range: 2.645-0.405' (engine_specs/cars/accord_2018_15t.toml [cvt_ratio_range])" }
ratio_top_gear = { value = 0.405, label = "PUBLISHED", source = "the CVT's highest gear, as ratio_low_gear" }
driveline_eff = { value = 0.92, label = "ASSUMED", source = "CARRIED FROM THE B58: engine_specs/a90_supra.toml [car] driveline_eff (ASSUMED there: REFERENCES.md section 4b, CANNOT). Not published for this car; the vehicles strand's 0.78 is an ECU number, UNVERIFIED (engine_specs/cars/accord_2018_15t.toml [not_typed]). EPA's coast-down targets already hold the driveline's drag (engine_specs/cars/README.md), so the demand is also reported at 0.95, and the K3 knee at 0.86 and 0.98 (decision 44)" }
kickdown_load = { value = 0.75, label = "ASSUMED", source = "CARRIED FROM THE B58: engine_specs/a90_supra.toml [car] shift_load (ASSUMED there: the fraction of peak torque above which the Supra's box hands back a gear). Decision 40's lambda_kd: the CVT holds its top ratio while the demand there is at most this share of the deliverable torque (engine_env.CvtVehicle). Disclosed: 0.75 is also a point of the D3 strand's in-sample grid, used by no gated row (decision 40)" }
target_load = { value = 0.65, label = "DESIGN", source = "decision 40's lambda_target: after a kickdown the CVT runs the lowest engine speed whose demand is at most this share of the deliverable torque, below kickdown_load so the kickdown lands with a reserve (engines.CvtCar). Disclosed: 0.65 is a point of the D3 strand's in-sample grid, used by no gated row (decision 40)" }
cvt_rpm_min = { value = 1000.0, unit = "rpm", label = "DESIGN", source = "the lowest engine speed the ratio law runs, the lowest calibration line (rpm_min), not the strand's D3-derived 1250 (PLAN.md 7.5); the low-speed branch holds it below about 8.7 km/h (PLAN.md 7.3, amendment F6)" }
rpm_min = { value = 1000.0, unit = "rpm", label = "DESIGN", source = "the lowest calibration line, 1000 rpm: results/ENGINE_THRESHOLDS.json engines.honda_l15b7.lines (contract version 3), whose end lines are never held out (thresholds/split.py; amendment C13); never run the engine where it was not measured (mistake 6)" }
rpm_max = { value = 5000.0, unit = "rpm", label = "DESIGN", source = "the highest calibration line, 5000 rpm, as rpm_min: the ratio law's window never passes it (engine_env.CvtVehicle)" }
table_rpm_lo = { value = 1000, unit = "rpm", label = "DESIGN", source = "the deliverable-torque table's lowest speed, rpm_min: the grid lies inside the calibration lines, since np.interp clamps at the table's ends (PLAN.md 5.9 item 1)" }
table_rpm_hi = { value = 5000, unit = "rpm", label = "DESIGN", source = "the table's highest speed, rpm_max, as table_rpm_lo" }
table_rpm_step = { value = 100, unit = "rpm", label = "DESIGN", source = "the grid's spacing (PLAN.md 7.5)" }
table_t_amb = { value = 315.0, unit = "K", label = "DESIGN", source = "CARRIED FROM THE B58: engine_specs/a90_supra.toml [car] table_t_amb (DESIGN there: 42 C, the locked climb's ambient), this car's locked climb's too (decision 44)" }
table_t_block = { value = 365.0, unit = "K", label = "ASSUMED", source = "CARRIED FROM THE B58: engine_specs/a90_supra.toml [car] table_t_block (ASSUMED there: a warm block, 92 C, no reason recorded for 365 K)" }
table_settle = { value = 30, label = "ASSUMED", source = "CARRIED FROM THE B58: engine_specs/a90_supra.toml [car] table_settle (DERIVED_ONCE there: the load loop's steps per speed, 11 October 2026). The table is re-measured at 60 and the largest difference reported (PLAN.md 5.9 item 1)" }

[scenario]
# THE LOCKED CLIMB of every car (decision 44): the Supra's, decided by the team on
# 18 September 2026 (engine_specs/a90_supra.toml [scenario]), with the delivery
# reported; a climb at the highest delivered speed is the declared remedy.
grade = { value = 0.12, label = "DESIGN", source = "CARRIED FROM THE B58: engine_specs/a90_supra.toml [scenario] grade (DESIGN there: 12 %, the locked climb). The same climb for every car (decision 44)" }
v_kmh = { value = 130.0, unit = "km/h", label = "DESIGN", source = "CARRIED FROM THE B58: engine_specs/a90_supra.toml [scenario] v_kmh (DESIGN there: 130 km/h), as grade. EPA's road load is valid 15-115 km/h, so the climb extrapolates it (mistake 6; engine_env.EpaVehicle)" }
t_amb = { value = 315.0, unit = "K", label = "DESIGN", source = "CARRIED FROM THE B58: engine_specs/a90_supra.toml [scenario] t_amb (DESIGN there: 42 C), as grade" }
