axle_ratio = 3.31
n_over_v_rpm_per_mph = 26
note = "the other 4x2 2.7 L test truck (body not named); the 'F-150 Super Cab Max' rows (3.73 axle, 5250 lb) are another configuration"

[not_typed]
tyre_size = "Ford's 2015 specification sheet prints none; a secondary listing (cars.com, a 3.5 L V6 XL) shows P245/70R17, which is another truck. Not typed: the model needs the rolling radius, which EPA's N/V fixes for the tested truck"
rolling_radius_m = "no source prints it. DERIVE it in code from EPA's N/V with the top gear (0.69) and the axle ratio (3.31). Never type the result here"
curb_weight = "not in Ford's specification sheet, and no Ford figure was found (the vehicles strand). The road load uses EPA's test weight; EPA's 4750 lb class bounds the loaded weight (40 CFR 1066.805), a derivation left to the code"
drag_area_and_rolling_coefficient = "not published. The road load is EPA's A, B, C above"
driveline_efficiency = "not published. ASSUMED wherever the code needs it, and labelled so there"
shift_schedule = "no driving data for this truck; the 6R80 sibling in D3 (a 2012 F-150 3.5 L EcoBoost) is the only lead, and the result is ASSUMED"

[sources.FORD]
