note = "FWD, MODEL YEAR 2019 (AWD 4383 lb): no Mazda sheet for 2016 was opened -- the 2016 and 2017 downloads of 20 October returned web pages, not the PDFs. A 2016 figure exists only in a secondary listing (cars.com, 4054 lb for a FWD Sport), not typed here. The road load uses EPA's test weight below, not this"

# The EPA Test Car List row of the D3 car's configuration: Argonne set its dynamometer to these
# exact targets for all 70 tests (CATALOGUE.md section 2.1; NH519 Table 5 prints them rounded).
# Coefficients: road-load force F = A + B v + C v^2 with F in lbf and v in mph.
[epa_test_car]
status = "PUBLISHED"
source = "EPA16"
file_rows = [2677, 2678]
model_year = 2016
represented_model = "CX-9"
test_vehicle_id = "6EBPYTG2-042"
engine_code = "6PYTGAAB"
tested_transmission = "Automatic, 6 gears"
equivalent_test_weight_lb = 4500
target_coef_a_lbf = 40.443
target_coef_b_lbf_per_mph = 0.25936
target_coef_c_lbf_per_mph2 = 0.026369
axle_ratio = 4.41
n_over_v_rpm_per_mph = 30.5
note = "rows 2677-2678 (header = row 1); the same test vehicle also carries rows 2675-2676 with other targets (below), and a 4250 lb configuration 6EBPYTS1-039 (rows 2679-2682) is another car"

[[epa_test_car_other_rows]]
status = "PUBLISHED"
source = "EPA16"
file_rows = [2675, 2676]
model_year = 2016
represented_model = "CX-9"
test_vehicle_id = "6EBPYTG2-042"
engine_code = "6PYTGAAB"
tested_transmission = "Automatic, 6 gears"
equivalent_test_weight_lb = 4500
target_coef_a_lbf = 34.833
target_coef_b_lbf_per_mph = 0.39175
target_coef_c_lbf_per_mph2 = 0.024874
axle_ratio = 4.41
n_over_v_rpm_per_mph = 30.5
note = "same test vehicle and weight, other targets; NOT the set D3 drove on"

[not_typed]
rolling_radius_m = "no source prints it. DERIVE it in code: from EPA's N/V (engine rpm per mph in top gear) with the top gear and the axle ratio, or measure it on the D3 data (the vehicles strand found the two differ by 1.6 %, UNVERIFIED here: README.md). Never type the result here"
drag_area_and_rolling_coefficient = "not published for this car (Mazda prints no Cd). The road load is EPA's A, B, C above; fitting a two-term crr/CdA to them is a derivation and lives in code"
driveline_efficiency = "not published. ASSUMED wherever the code needs it (the B58's 0.92), and labelled so there"

