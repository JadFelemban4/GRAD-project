# engine_specs/ford_27tt.toml -- the 2015 Ford 2.7 L EcoBoost V6, twin-turbocharged,
# of EPA's ALPHA map package: its TYPED constants, for the plant the EPA calibration
# fits (build step 2 of decision 24). Its car is engine_specs/f150_2015.toml.
#
# The format, the labels and the rule against typed DERIVED values are
# engine_specs/b58.toml's (engines.read_spec). Written on 22 October 2026 (build
# step 2 P6: docs/build_step_2/PLAN.md WP1 P6 and section 9.2, as its amendments
# docs/build_step_2/AMENDMENTS.md F10, F12, B13 and C13 correct it; decisions 45,
# 46 and 69, results/VALIDATION_DECISIONS.md section H), before any fit: no value
# here was set by an EPA row, and none was compared with one. The layout and every
# carried value are engine_specs/mazda_25t.toml's, written the same day.
#
# THE DERIVED VALUES ARE NOT HERE, AND NOT YET ANYWHERE. engines.EPA_DERIVED_FIELDS
# names them (PLAN.md 5.8): the cycle model's form and its fitted constants, the
# ECU's spark, knock limit, enrichment and cam schedule, and the boost envelope,
# written at the freeze; the deliverable-torque table, the K3 knee and the torque
# floor, completed after it. calibrate_epa.py (WP3-WP4, not written yet) writes
# them to the derived file named below. Until it has, this plant is registered
# and NOT CALIBRATED: engines.get refuses it, naming that command, and
# `python engines.py` lists it as "not calibrated yet". The form is the
# calibration's too: the ladder starts at form A (PLAN.md 5.4), and a term the
# frozen form does not use is written there at its neutral value (ve_map 0.0,
# ve_cam 0.0, ce_rich_slope 0.65, cam_on 0 and the cam schedule 0.0), never
# typed here.
#
# CARRIED FROM THE B58 (decision 45). EPA's rig cannot set the thermal network,
# the ECU's compensations, its knock feedback, the fan or the turbine housing
# (EPA held coolant and oil), nor the constants the validation contract shares
# between engines. Each such value is the B58's, bit for bit, and its source
# starts "CARRIED FROM THE B58: " and names where the B58's value lives:
# engine_specs/b58.toml or engine_specs/a90_supra.toml [section] field, or the
# B58's derived file data/derived_params.json section.key (derived_sha
# 326c0835548975e2). test_carried.py checks each against the B58's plant, and
# every other typed value against the value its source gives, pinned there with
# the file and key it comes from: a second typed copy, whose cross-check against
# the contract and epa_engine.json is WP3's (docs/build_step_2/HANDOFFS.md). The
# label says what the value is FOR THIS ENGINE: ASSUMED where the B58's number is
# an estimate, a fit or a measurement of the B58's own, since carrying it to
# another engine is an assumption; DESIGN where it is a choice that defines the
# experiment; CORRELATION where it is a correlation's constant.

id = "ford_27tt"
derived = "data/engines/ford_27tt/derived_params.json"
# derived_set -- which fields of this engine's records are DERIVED and where in the
# derived file each is read (engines.DERIVED_BY_SET): "epa", engines.EPA_DERIVED_FIELDS,
# what the EPA calibration writes (PLAN.md 5.8). label DESIGN; source: build step 2
# P5 and P6 (docs/build_step_2/PLAN.md WP1), 22 October 2026. A top-level key cannot
# be a { value, label, source } entry (engines.read_spec reads a table as a section),
# so its label and source are this comment (amendment B13); it is hashed by its value.
derived_set = "epa"
# freeze -- this engine's freeze record: the sha256 of its derived file's frozen
# sections (engines.FROZEN_SECTIONS: cycle, ecu, boost_ceiling), written by
# calibrate_epa.py at the freeze; engines._build refuses the derived file unless its
# frozen sections hash to it (PLAN.md 5.8, amendment F7). label DESIGN; source:
# PLAN.md 5.8 and build step 2 P6, 22 October 2026; a comment, as derived_set's
# (amendment B13).
freeze = "results/EPA_CALIBRATION/ford_27tt/freeze.json"

