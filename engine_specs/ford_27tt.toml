stroke = { value = 0.0830, unit = "m", label = "PUBLISHED", source = "83 mm: epa_engine.json stroke_mm, the ALPHA engine file's engine.stroke_mm (geometry_notes); with the bore it displaces 2.69448 L (epa_engine.json displacement_from_bore_stroke_l); the package states 2.694 L" }
