n_cyl = { value = 6, label = "PUBLISHED", source = "a V6: epa_engine.json n_cylinders (the ALPHA engine file); Ford's 2015 F-150 specifications (engine_specs/cars/f150_2015_27tt.toml [sources.FORD]): the 2.7L EcoBoost V6" }
