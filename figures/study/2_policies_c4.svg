<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">SUPERVISION</text>
<text x="167.6" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">a separate claim from preview: the blind agents beat the rule as well (AUDIT.md C3)</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">The median is below current-grade's for 8 of 8 sighted and 7 of 8 blind agents; on the worst episode, 4 of 8 sighted and 5 of 8 blind agents</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">do worse than current-grade's worst. The hand-written rows ignore the preference weights, so every seed's file carries the same values for</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">them. The files give the middle half's width but not its quartiles, so no bar is drawn; the widths are in the tables below. C4: 300 000</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">training steps, not converged, the random climb. Data: results/c4_seed*.txt.</text>
