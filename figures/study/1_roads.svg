<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="The twenty frozen test roads by climb start and grade, the training box, and Phase D's one road" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb" class="f-surface"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="600">The roads: when the climb starts, and how steep it is</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">20 frozen test roads for Phase D2 and C4 · training draws a new road every episode from the shaded box · Phase D had one road</text>
<rect x="56.00" y="86.00" width="109.19" height="23.00" rx="4" fill="#f0efec" class="f-tag" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">THE TEST SET</text>
<text x="175.2" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">frozen 22 September 2026, before any D2 agent trained (evaluate.EPISODES_D2)</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">Every road is flat until the climb starts, then holds one grade to the end of the episode, at 130 km/h in 42 °C air. Phase D trained and</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">scored on one road, the climb at 180 s every time, which is how its blind arm could learn when the hill comes (results/PREREGISTRATION.md</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">limit 7). Phase D2 and C4 train on a new road drawn from the box every episode and are scored on these twenty, each with its own preference</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">weights. Data: evaluate.py, random_road.py, engine_env.make_grade_climb().</text>
