<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="C4: median damage against median fuel for every policy" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb" class="f-surface"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="600">C4: damage against fuel, every policy</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">medians over the twenty frozen episodes · a line joins the two agents of a pair · lower is less damage, left is less fuel</text>
<rect x="56.00" y="86.00" width="33.20" height="23.00" rx="4" fill="#f0efec" class="f-tag" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">C4</text>
<text x="99.2" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">C4: 300 000 training steps, not converged, the random climb</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">Each point is a policy's median on both axes, so it is not one episode, and the two medians need not come from the same episode. Fuel is</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">what the engine burned over the episode, in grams; it is one of the three things the agents are asked to weigh. The unprotected ECU is the</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">baseline ECU. Data: results/c4_seed*.txt.</text>
