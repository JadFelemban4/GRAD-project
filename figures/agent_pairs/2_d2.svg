<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb" class="f-surface"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="600">Phase D2: eight pairs on a randomised climb</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">inconclusive · C1 agents, 50 000 steps</text>
<rect x="56.00" y="86.00" width="109.19" height="23.00" rx="4" fill="#f0efec" class="f-tag" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">INCONCLUSIVE</text>
<text x="175.2" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">C1 budget, 50 000 training steps · 22-23 September 2026</text>
<text x="56.0" y="542.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">A pair is two agents trained from the same seed, with the same code and budget; only the preview channel differs. Each dot is one agent's</text>
<text x="56.0" y="558.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">median damage over the same 20 frozen test episodes (evaluate.py); lower is less damage. blind − sighted above zero means the blind agent</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">took more damage, so preview helped in that pair; bold marks a pair at or above the 50-unit minimum effect of interest. The climb's start</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">and grade were drawn per episode and the blind arm was checked blind before training (check_random_road.py). The minimum effect of interest,</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">50 units, was set before this experiment. The unprotected baseline ECU scores 1118.0 here, off the top of the chart. Data:</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">results/d2_seed*.txt.</text>
