<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Phase D: each of eight pairs as two dots, the sighted and the blind agent's median damage" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb" class="f-surface"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="600">Phase D: eight pairs on a fixed climb</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">not significant · inconclusive (post-hoc) · the &quot;blind&quot; arm is not blind · C1 agents</text>
<rect x="56.00" y="86.00" width="131.99" height="23.00" rx="4" fill="#f0efec" class="f-tag" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">NOT SIGNIFICANT</text>
<text x="198.0" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">C1 budget, 50 000 training steps · 21-22 September 2026</text>
<text x="56.0" y="542.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">A pair is two agents trained from the same seed, with the same code and budget; only the preview channel differs. Each dot is one agent's</text>
<text x="56.0" y="558.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">median damage over the same 20 frozen test episodes (evaluate.py); lower is less damage. blind − sighted above zero means the blind agent</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">took more damage, so preview helped in that pair; bold marks a pair at or above the 50-unit minimum effect of interest. Phase D's blind arm</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">is not blind: the climb comes at the same second on every episode, so the blind agent could learn when it comes (results/PREREGISTRATION.md</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">limit 7). Its minimum effect of interest was set after this result, so reading it against 50 units is post-hoc. The unprotected baseline ECU</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">scores 959.8 here, off the top of the chart. Data: results/phase_d_seed*.txt.</text>
