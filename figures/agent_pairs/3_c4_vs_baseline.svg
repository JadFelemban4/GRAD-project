<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb" class="f-surface"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="600">C4: every agent against the baseline ECU</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">share of the baseline ECU's median damage (1118.0) that each agent removes · median of the twenty frozen episodes · higher is better</text>
<rect x="56.00" y="86.00" width="101.59" height="23.00" rx="4" fill="#f0efec" class="f-tag" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">SUPERVISION</text>
<text x="167.6" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">learned protection, not preview: the blind agent is measured the same way</text>
<text x="56.0" y="558.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">Read from the 'cuts median damage' lines evaluate.py printed in results/c4_seed*.txt, each checked against the medians beside it. The grey</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">line is current-grade, the best hand-written policy, and it is what an agent has to beat. The baseline ECU never enriches on this scenario</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">and the agents can, so part of every cut measured against the baseline comes from a lever it does not pull here (CLAUDE.md, limitations).</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">This chart measures learned protection; whether seeing the road ahead helps is the next chart's question, in the damage units its test was</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">registered in.</text>
