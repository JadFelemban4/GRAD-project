<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="C4: each of eight pairs as two dots, the sighted and the blind agent's median damage" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb" class="f-surface"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="600">C4: Phase D2's design, trained to 300 000 steps</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">smaller than the MEI (50) at 300 000 steps · one seed wide · the two tests disagree · not converged</text>
<rect x="56.00" y="86.00" width="169.98" height="23.00" rx="4" fill="#f0efec" class="f-tag" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">SMALLER THAN THE MEI</text>
<text x="236.0" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">C4 budget, 300 000 training steps, not converged · 23-24 September 2026</text>
<text x="56.0" y="542.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">A pair is two agents trained from the same seed, with the same code and budget; only the preview channel differs. Each dot is one agent's</text>
<text x="56.0" y="558.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">median damage over the same 20 frozen test episodes (evaluate.py); lower is less damage. blind − sighted above zero means the blind agent</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">took more damage, so preview helped in that pair; bold marks a pair at or above the 50-unit minimum effect of interest. C4's agents are</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">Phase D2's agents trained longer, not a replication: every one retraced its D2 twin bit for bit through 50 000 steps. By the preregistered</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">rule they had not converged (results/C4_RESULT.txt). The unprotected baseline ECU scores 1118.0 here, off the top of the chart. Data:</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">results/c4_seed*.txt.</text>
