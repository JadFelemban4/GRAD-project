<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Scatter of the model's load against the ECU's relative air filling at the steady points" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">Engine load at the steady points: the model against the ECU's own load channel</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400">26 points, 30–75 kPa manifold pressure  ·  mean error 1.4 % with nothing fitted  ·  1.1 % with one fitted constant</text>
<rect x="56.00" y="86.00" width="147.19" height="23.00" rx="4" fill="#f0efec" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="700">CONSISTENCY CHECK</text>
<text x="213.2" y="102.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">not a test of the breathing model: η_v, residual gas and intake temperature cancel out</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">Horizontal: the ECU's 'Relative air filling'. Vertical: the model's load from the measured air mass, times k = 269.6 / T_charge -- the DIN</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">reference state, 1013 mbar and 0 °C -- with nothing fitted. Both sides are built from the same air-mass reading, so the agreement shows what</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">the ECU channel means and that the model has the right displacement (a wrong engine misses badly); it cannot show that the model breathes</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">like the car (CLAUDE.md mistake 12). 'Steady' means steady in road and engine speed only (AUDIT.md M3). Data: data/master_points.csv.</text>
