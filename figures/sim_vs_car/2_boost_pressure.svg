<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Distributions of boost pressure: the car's channel against the model's inversion" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb" class="f-surface"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="600">Boost pressure under boost: the model's value against the car's own boost channel</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">above 200 kPa  ·  model 762 samples, car 1,097 logged rows  ·  medians 228 and 224 kPa  ·  gap +1.9 %</text>
<rect x="56.00" y="86.00" width="147.19" height="23.00" rx="4" fill="#f0efec" class="f-tag" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">INDEPENDENT CHECK</text>
<text x="213.2" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">plant.charge_temperature() was written without this data and has no parameter fitted to it</text>
<text x="56.0" y="558.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">The two sides are different samples, not pairs: the logger reads one channel per row, so air mass and boost are never read at the same</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">instant, and two populations over the same region are compared by their medians. Model: manifold pressure inverted from the measured air</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">mass, with the modelled charge temperature. Grey: the same samples inverted with the pre-throttle sensor, which is a compressor outlet, not</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">the charge -- the dataset's error until 10 September (CLAUDE.md mistake 13). Samples at the air-mass sensor's ceiling are excluded (mistake</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">7). Data: data/master_samples.csv, logs/raw/*.csv.</text>
<rect x="56.00" y="136.00" width="22.00" height="12.00" rx="2" fill="#eb6834" class="f-car" fill-opacity="0.45"/>
<text x="86.0" y="146.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">the car: its Boost pressure channel</text>
<line x1="359.0" y1="142.0" x2="381.0" y2="142.0" stroke="#2a78d6" class="s-model" stroke-width="2.0" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="389.0" y="146.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">the model: inverted with charge_temperature()</text>
<line x1="732.0" y1="142.0" x2="754.0" y2="142.0" stroke="#898781" class="s-muted" stroke-width="2.0" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="762.0" y="146.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">the old error: inverted with the sensor</text>
