<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Lambda under boost in nine cells: the car's medians against the model's map" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">Enrichment: the mixture the car ran under boost, against the model's map</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400">1,341 samples above the 180 kPa gate  ·  nine cells by engine speed and seconds of dwell  ·  largest gap 0.076 in λ</text>
<rect x="56.00" y="86.00" width="40.80" height="23.00" rx="4" fill="#f0efec" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="700">FIT</text>
<text x="106.8" y="102.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">base_lambda v4 was fitted to these same samples (engine_env.BaselineECU); it tests nothing</text>
<text x="56.0" y="558.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">λ = 1 is the chemically exact mixture; below 1 is rich, fuel spent to cool the exhaust. Dwell = seconds of unbroken running above the gate,</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">from the timestamps (verify_docs.dwell_column). Dots are medians over the cell; the orange bar is the middle half of the car's samples; the</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">count under each cell is how many independent lambda readings it rests on (AUDIT.md H4). The map's dwell constants were fitted before</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">AUDIT.md H3 corrected the dwell axis, and the worst cell shows it: 4500–7000 rpm at 4-8 s, car 0.83 against model 0.91. The locked</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" text-anchor="start" font-weight="400">scenario's climb runs in the first panel's band, where the map never enriches. Data: data/master_samples.csv.</text>
