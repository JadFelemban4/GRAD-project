<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Histogram of the overall gear ratio the car ran, with the eight published ratios marked" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#fcfcfb" class="f-surface"/>
<text x="56.0" y="42.0" font-size="20" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="600">The gearbox: the ratios the car actually ran, against the eight Toyota publishes</text>
<text x="56.0" y="70.0" font-size="13.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">79,134 moving samples (above 20 km/h) from 7 drives  ·  86.7 % lie within ±4% of a published ratio</text>
<rect x="56.00" y="86.00" width="147.19" height="23.00" rx="4" fill="#f0efec" class="f-tag" fill-opacity="1.0"/>
<text x="65.0" y="102.0" font-size="11.5" fill="#0b0b0b" class="f-ink" text-anchor="start" font-weight="700">INDEPENDENT CHECK</text>
<text x="213.2" y="102.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">the ratios and the final drive are Toyota's published figures; nothing was fitted to these logs</text>
<text x="56.0" y="574.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">Overall ratio = engine rpm ÷ wheel rpm, the wheel's rpm taken from road speed and the model's wheel radius (0.33 m, whose source is not</text>
<text x="56.0" y="590.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">recorded). The radius shifts all eight peaks together, so the SPACING of the peaks is the independent part. Samples between the peaks are</text>
<text x="56.0" y="606.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">gear changes and torque-converter slip, which the model does not simulate: it assumes the converter locked. The car's own 'Actual gear'</text>
<text x="56.0" y="622.0" font-size="11.3" fill="#898781" class="f-muted" text-anchor="start" font-weight="400">channel stops at 6, so it is not used (CLAUDE.md mistake 18). Data: data/master_samples.csv.</text>
<rect x="56.00" y="136.00" width="22.00" height="12.00" rx="2" fill="#eb6834" class="f-car" fill-opacity="1.0"/>
<text x="86.0" y="146.0" font-size="12.5" fill="#52514e" class="f-ink2" text-anchor="start" font-weight="400">the car: the ratio it ran, per sample</text>
